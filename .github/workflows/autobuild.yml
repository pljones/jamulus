# This file builds the source and produces artifacts for every supported platform.
# For release tags it creates a Github release and uploads the binaries to that releases.
# The builds are instrumented with CodeQL.

# see analyse_git_reference.py for implementation of the logic:
#     for every push to a branch starting with "autobuild": (can be used during development for tighter supervision of builds)
#          - do CodeQl while building for every platform
#          - publish the created binaries/packs only as artifacts/appendix of the github-action-run (not as release), and only retain those files for limited period
#     for every pull-request to main:
#          - do CodeQl while building for every platform
#          - publish the created binaries/packs only as artifacts/appendix of the github-action-run (not as release), and only retain those files for limited period
#     for every tag that starts with 'r' and has an arbitrary suffix (e.g. beta1, rc1, etc.)
#          - do CodeQl while building for every platform
#          - publish the created binaries/packs only as artifacts/appendix as a prerelease
#     for every tag that starts with 'r' and does not have any suffix:
#          - do CodeQl while building for every platform
#          - publish the created binaries/packs only as artifacts/appendix as a release
# Android release builds are signed when the ANDROID_* signing secrets are all set.
# A manual run with android_play_store_upload builds only the Qt 5 release .aab (instead of the
# .apk and all other targets) and uploads it to Google Play (the run fails early if prerequisites are missing)
# (see publish_android_play_store); android_play_store_real_publish selects beta draft instead of internal sharing.

on:
  workflow_dispatch:
    inputs:
      build_all_targets:
        type: boolean
        description: 'Build all targets (instead of just the main platforms)'
      android_play_store_upload:
        type: boolean
        description: 'Android: build a Qt 5 release .aab and upload it to Google Play (needs release signing and Play secrets/variables)'
      android_play_store_real_publish:
        type: boolean
        description: 'Android: upload to the beta track as a draft instead of internal app sharing'
  push:
    tags:
      - 'r*'
    branches:
      # For developers: Branches starting with autobuild will be built and evaluated on each push.
      - 'autobuild**'
      # CodeQL requires every branch from on.pull_request to be part of on.push as well in order to run comparisons.
      # We also need main here to trigger builds on PR merge to main and manual pushes (e.g. as part of the release process):
      - 'main'
      - 'release/**'
    paths-ignore:
      - '**README.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'COMPILING.md'
      - 'COPYING'
      - 'APPLEAPPSTORE.LICENCE.WAIVER'
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/pull_request_template.md'
  pull_request:
    branches:
      - 'main'
      - 'release/**'
    paths-ignore:
      - '**README.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'COMPILING.md'
      - 'COPYING'
      - 'APPLEAPPSTORE.LICENCE.WAIVER'
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/pull_request_template.md'

name:                               Auto-Build
permissions:                        {}
jobs:
  create_release:
    # Check if we are doing a release or just a normal build.
    # This must be done before actually building the app to find out where to upload the binaries and if we need to create a Github release.
    name:                           Build vars & Github release (if required)
    runs-on:                        ubuntu-24.04-arm
    outputs:
      publish_to_release:           ${{ steps.get-build-vars.outputs.PUBLISH_TO_RELEASE }}
      tag_name:                     ${{ steps.get-build-vars.outputs.RELEASE_TAG }}
      build_version:                ${{ steps.get-build-vars.outputs.BUILD_VERSION }}
      build_all_targets:            ${{ steps.decide-build-targets.outputs.build_all_targets }}
      android_signing_ready:        ${{ steps.android-readiness.outputs.signing_ready }}
      android_play_store_upload:    ${{ steps.android-readiness.outputs.play_store_upload }}
    env:
      release_changelog_path:       ./.github_release_changelog.md
    # Set permissions. We need write permissions to content for creating/removing the release
    permissions:
        contents:                   write
    steps:
      - name:                       Checkout code
        uses:                       actions/checkout@v7

      - name:                       Fail fast if a requested Google Play upload cannot be done
        if:                         github.event_name == 'workflow_dispatch' && github.event.inputs.android_play_store_upload == 'true'
        env:
          HAVE_KEYSTORE:            ${{ secrets.ANDROID_KEYSTORE != '' }}
          HAVE_KEY_ALIAS:           ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAVE_KEYSTORE_PASSWORD:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_PASSWORD:        ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAVE_GCP_PROVIDER:        ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL != '' }}
        run:                        |
          missing=""
          [[ "${HAVE_KEYSTORE}" == 'true' ]] || missing="${missing} secrets.ANDROID_KEYSTORE"
          [[ "${HAVE_KEY_ALIAS}" == 'true' ]] || missing="${missing} secrets.ANDROID_KEY_ALIAS"
          [[ "${HAVE_KEYSTORE_PASSWORD}" == 'true' ]] || missing="${missing} secrets.ANDROID_KEYSTORE_PASSWORD"
          [[ "${HAVE_KEY_PASSWORD}" == 'true' ]] || missing="${missing} secrets.ANDROID_KEY_PASSWORD"
          [[ "${HAVE_GCP_PROVIDER}" == 'true' ]] || missing="${missing} vars.GCP_WORKLOAD_IDENTITY_PROVIDER"
          [[ "${HAVE_GCP_SERVICE_ACCOUNT}" == 'true' ]] || missing="${missing} vars.GCP_SERVICE_ACCOUNT_EMAIL"
          if [[ -n "${missing}" ]]; then
            echo "::error::Google Play upload requested but these are not set:${missing}"
            exit 1
          fi

      - name:                       Determine release version, type and prerelease variables
        run:                        ./.github/autobuild/get_build_vars.py
        id:                         get-build-vars

      - name:                       Extract Changelog for the Github release body
        if:                         steps.get-build-vars.outputs.PUBLISH_TO_RELEASE == 'true'
        run:                        ./.github/autobuild/extractVersionChangelog.pl ChangeLog ${{ steps.get-build-vars.outputs.JAMULUS_PRO_VERSION }} > ${{ env.release_changelog_path }}

      - name:                       Create/Recreate Release ${{steps.get-build-vars.outputs.RELEASE_TAG}}  ${{steps.get-build-vars.outputs.RELEASE_TITLE}}
        if:                         steps.get-build-vars.outputs.PUBLISH_TO_RELEASE == 'true'
        id:                         create-release
        run:                        |
          set -eu

          # delete release if existing
          gh release delete "${tag_name}" || true

          RELEASE_PRERELEASE_ARG=""
          if [[ "${prerelease}" == 'true' ]]; then
            RELEASE_PRERELEASE_ARG="--prerelease"
          fi
          # Actually create the release. This will print the release url if successful
          gh release create "${tag_name}" --title "${release_name}" --notes-file "${body_path}" ${RELEASE_PRERELEASE_ARG}

        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          tag_name:                 ${{ steps.get-build-vars.outputs.RELEASE_TAG }}
          release_name:             ${{ steps.get-build-vars.outputs.RELEASE_TITLE }}
          body_path:                ${{ env.release_changelog_path }}
          prerelease:               ${{ steps.get-build-vars.outputs.IS_PRERELEASE }}

      - name:                       Check Android signing and Google Play readiness
        id:                         android-readiness
        env:
          HAVE_KEYSTORE:            ${{ secrets.ANDROID_KEYSTORE != '' }}
          HAVE_KEY_ALIAS:           ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAVE_KEYSTORE_PASSWORD:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_PASSWORD:        ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAVE_GCP_PROVIDER:        ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAVE_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL != '' }}
          INPUT_PLAY_STORE_UPLOAD:  ${{ github.event.inputs.android_play_store_upload }}
        run:                        |
          set -eu
          signing_ready=false
          if [[ "${HAVE_KEYSTORE}" == 'true' && "${HAVE_KEY_ALIAS}" == 'true' && "${HAVE_KEYSTORE_PASSWORD}" == 'true' && "${HAVE_KEY_PASSWORD}" == 'true' ]]; then
            signing_ready=true
          fi
          play_store_upload=false
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' && "${INPUT_PLAY_STORE_UPLOAD}" == 'true' ]]; then
            if [[ "${signing_ready}" == 'true' && "${HAVE_GCP_PROVIDER}" == 'true' && "${HAVE_GCP_SERVICE_ACCOUNT}" == 'true' ]]; then
              play_store_upload=true
            else
              echo "::error::Android Google Play upload requested but signing secrets (ANDROID_KEYSTORE, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD) or GCP variables (GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL) are missing."
              exit 1
            fi
          fi
          echo "signing_ready=${signing_ready}" >> $GITHUB_OUTPUT
          echo "play_store_upload=${play_store_upload}" >> $GITHUB_OUTPUT

      - name:                       Decide which targets to build for
        id:                         decide-build-targets
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUILD_ALL_TARGETS:  ${{ github.event.inputs.build_all_targets }}
          PR_NUMBER:                ${{ github.event.number }}
          PR_BASE:                  ${{ github.event.pull_request.base.sha }}
          PR_HEAD:                  ${{ github.event.pull_request.head.sha }}
        run:                        |
          set -eu
          build_all_targets() {
            echo "build_all_targets=${1}" >> $GITHUB_OUTPUT
            echo "Building for all targets? Result: ${1}"
            exit 0
          }

          handle_push() {
            if [[ "${GITHUB_REF}" == "refs/tags/"* ]]; then
              echo 'Triggered by a tag push, building all targets'
              build_all_targets 'true'
            fi
            if [[ "${GITHUB_REF}" =~ ^refs/heads/autobuild ]]; then
              echo 'Triggered by a push to an autobuild* branch, building all targets'
              build_all_targets 'true'
            fi
          }

          handle_workflow_dispatch() {
            if [[ "${INPUT_BUILD_ALL_TARGETS}" == 'true' ]]; then
              echo 'Triggered by manual run with "Build all targets" checkbox set'
              build_all_targets 'true'
            fi
          }

          handle_pull_request() {
            pr_body_contains_magic_string() {
              pr_body=$(gh pr view "${PR_NUMBER}" --json body --jq .body)
              grep -vP '<!--' <<< "$pr_body" | grep -qiF -- 'AUTOBUILD: Please build all targets'
            }
            if pr_body_contains_magic_string; then
              echo 'Triggered by a PR with magic AUTOBUILD: string, building all targets'
              build_all_targets 'true'
            fi

            pr_contains_build_changes() {
              git fetch origin "${PR_BASE}" "${PR_HEAD}"
              git diff --name-only "${PR_BASE}..${PR_HEAD}" |
                grep -qP 'autobuild|windows|linux|mac|ios|android|\.pro'
            }
            if pr_contains_build_changes; then
              echo 'Triggered by a PR with build- or platform-specific changes, building all targets'
              build_all_targets 'true'
            fi
          }

          case "${GITHUB_EVENT_NAME}" in
            push)
              handle_push
              ;;
            workflow_dispatch)
              handle_workflow_dispatch
              ;;
            pull_request)
              handle_pull_request
              ;;
          esac

          echo 'default case, not building all targets'
          build_all_targets 'false'


  release_assets:
    name:                           Build for ${{ matrix.config.config_name }}
    needs:                          create_release
    # Set permissions to allow uploading artifact, uploading to release and allowing CodeQl to set security events
    permissions:
      checks:                       write
      contents:                     write
      security-events:              write
    strategy:
      fail-fast:                    false
      matrix:
        # Think of this like a foreach loop. Basically runs the steps with every combination of
        # the contents of this.
        config:
          - config_name:            Android Qt5 .apk (artifact+codeQL)
            target_os:              android
            building_on_os:         ubuntu-22.04
            # override runner environment variables to avoid picking up any pre-installed Android SDK/NDK/Qt versions
            base_command:           JAVA_HOME= QT_DIR= ANDROID_NDK_ROOT= ANDROID_SDK_ROOT= JAMULUS_ANDROID_STREAM=qt5 ./.github/autobuild/android.sh
            run_codeql:             true
            is_main_build_target:   true
            dependency_cache_key:   qt5
            # Jamulus.pro needs to count git history length for android versioning:
            checkout_fetch_depth:   '0'

          # Replaces the Qt 5 .apk build when requested (workflow_dispatch with android_play_store_upload); see the exclude rules below.
          - config_name:            Android Qt5 .aab (Google Play)
            target_os:              android
            building_on_os:         ubuntu-22.04
            base_command:           JAVA_HOME= QT_DIR= ANDROID_NDK_ROOT= ANDROID_SDK_ROOT= JAMULUS_ANDROID_STREAM=qt5 JAMULUS_ANDROID_PACKAGE_FORMAT=aab BUILD_MODES=release ./.github/autobuild/android.sh
            run_codeql:             false
            is_main_build_target:   true
            play_store_upload:      true
            dependency_cache_key:   qt5
            checkout_fetch_depth:   '0'

          - config_name:            Android Qt6 ABI APK ZIPs (experimental)
            target_os:              android
            building_on_os:         ubuntu-22.04
            base_command:           JAVA_HOME= QT_DIR= ANDROID_NDK_ROOT= ANDROID_SDK_ROOT= JAMULUS_ANDROID_STREAM=qt6 ./.github/autobuild/android.sh
            run_codeql:             false
            dependency_cache_key:   qt6
            checkout_fetch_depth:   '0'

          - config_name:            Linux .deb amd64 (artifacts+codeQL)
            target_os:              linux
            building_on_os:         ubuntu-22.04
            base_command:           ./.github/autobuild/linux_deb.sh
            run_codeql:             true
            is_main_build_target:   true

          - config_name:            Linux .deb armhf (artifacts)
            target_os:              linux
            building_on_os:         ubuntu-22.04-arm
            base_command:           TARGET_ARCH=armhf ./.github/autobuild/linux_deb.sh
            run_codeql:             false

          - config_name:            Linux .deb arm64 (artifacts)
            target_os:              linux
            building_on_os:         ubuntu-22.04-arm
            base_command:           TARGET_ARCH=arm64 ./.github/autobuild/linux_deb.sh
            run_codeql:             false

          - config_name:            MacOS (artifacts)
            target_os:              macos
            building_on_os:         macos-15
            base_command:           QT=6 SIGN_IF_POSSIBLE=1 TARGET_ARCHS="x86_64 arm64" ./.github/autobuild/mac.sh
            # Disable CodeQL on mac as it interferes with signing the binaries (signing hangs, see #2563 and #2564)
            run_codeql:             false
            xcode_version:          16.3.0
            dependency_cache_key:   qt6
            is_main_build_target:   true

          # Reminder: If Legacy is removed, be sure to add a dedicated job for CodeQL again.
          - config_name:            MacOS Legacy (artifacts+CodeQL)
            target_os:              macos
            building_on_os:         macos-15-intel
            base_command:           QT=5 SIGN_IF_POSSIBLE=0 ARTIFACT_SUFFIX=_legacy ./.github/autobuild/mac.sh
            # Enable CodeQL on mac legacy as this version does not get signed
            run_codeql:             true
            # macos-15-intel ships with Xcode 16.x; while Qt5 is older, Xcode 16 still supports building it
            # https://developer.apple.com/support/xcode/
            # https://xcodereleases.com/
            xcode_version:          16.3.0
            dependency_cache_key:   qt5
            is_main_build_target:   true

          - config_name:            iOS (artifacts)
            target_os:              ios
            building_on_os:         macos-15
            base_command:           ./.github/autobuild/ios.sh
            # Build failed with CodeQL enabled when last tested 03/2022 (#2490).
            # There are no hints that iOS is supposed to be supported by CodeQL.
            # Therefore, disable it:
            run_codeql:             false
            xcode_version:          26.2
            dependency_cache_key:   ios

          - config_name:            Windows (artifact+codeQL)
            target_os:              windows
            building_on_os:         windows-2025
            base_command:           powershell .\.github\autobuild\windows.ps1 -Stage
            run_codeql:             true
            dependency_cache_key:   asio
            is_main_build_target:   true

          - config_name:            Windows JACK (artifact)
            target_os:              windows
            building_on_os:         windows-2025
            base_command:           powershell .\.github\autobuild\windows.ps1 -BuildOption jackonwindows -Stage
            run_codeql:             false
            dependency_cache_key:   jack

        # This injects the build_all_targets information into each matrix output:
        build_all_targets:
          - ${{ needs.create_release.outputs.build_all_targets }}
        play_store_upload:
          - ${{ needs.create_release.outputs.android_play_store_upload }}

        exclude:
          # Exclude all non-main build targets if we are not building for all targets:
          - build_all_targets:      'false'  # This is based on a script output and is therefore a string
            config:
              is_main_build_target: null
          # Exclusions: the Qt 5 .aab unless uploading to Google Play; everything except the .aab when uploading.
          - play_store_upload:      'false'
            config:
              play_store_upload:    true
          - play_store_upload:      'true'
            config:
              play_store_upload:    null

    runs-on:                        ${{ matrix.config.building_on_os }}
    steps:
      - name:                       Select Xcode version for Mac
        if:                         matrix.config.target_os == 'macos' || matrix.config.target_os == 'ios'
        uses:                       maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version:            ${{ matrix.config.xcode_version }}

      - name:                       Checkout code
        uses:                       actions/checkout@v7
        with:
          # only Android needs the oboe submodule, so don't fetch it for other builds
          submodules:               ${{ matrix.config.target_os == 'android' }}
          fetch-depth:              ${{ matrix.config.checkout_fetch_depth || '1' }}

      - name:                       Cache Mac dependencies
        if:                         matrix.config.target_os == 'macos' && matrix.config.dependency_cache_key == 'qt6'
        uses:                       actions/cache@v6
        with:
          path: |
            ~/qt
            ~/Library/Cache/jamulus-dependencies
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/mac-dependencies_qt6.sh') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Cache Mac Legacy dependencies
        if:                         matrix.config.target_os == 'macos' && matrix.config.dependency_cache_key == 'qt5'
        uses:                       actions/cache@v6
        with:
          path: |
            ~/qt
            ~/Library/Cache/jamulus-dependencies
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/mac-dependencies_qt5.sh') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Cache iOS dependencies
        if:                         matrix.config.target_os == 'ios'
        uses:                       actions/cache@v6
        with:
          path: ~/qt
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/ios-dependencies.sh') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Cache Windows dependencies
        if:                         matrix.config.target_os == 'windows'
        uses:                       actions/cache@v6
        with:
          path: |
            C:\Qt
            C:\ChocoCache
            C:\AutobuildCache
            ${{ github.workspace }}\libs\NSIS\NSIS-source
            ${{ github.workspace }}\libs\ASIOSDK2
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/windows-dependencies.ps1') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Cache Android dependencies
        if:                         matrix.config.target_os == 'android' && matrix.config.dependency_cache_key == 'qt5'
        uses:                       actions/cache@v6
        with:
          path: |
            ~/qt
            ~/android-sdk
            ~/android-ndk
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/android-dependencies_qt5.sh') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Cache Android Qt6 dependencies
        if:                         matrix.config.target_os == 'android' && matrix.config.dependency_cache_key == 'qt6'
        uses:                       actions/cache@v6
        with:
          path: |
            ~/qt
            ~/android-sdk
            ~/android-ndk
          key:                      ${{ matrix.config.target_os }}-${{ hashFiles('.github/autobuild/android-dependencies_qt6.sh') }}-${{ matrix.config.dependency_cache_key }}

      - name:                       Set up build dependencies for ${{ matrix.config.config_name }}
        run:                        ${{ matrix.config.base_command }} setup
        env:
          JAMULUS_BUILD_VERSION:    ${{ needs.create_release.outputs.build_version }}

      - name:                       Initialize CodeQL
        if:                         matrix.config.run_codeql
        uses:                       github/codeql-action/init@v4.38.1
        with:
          languages: 'cpp'

      - name:                       Build for ${{ matrix.config.config_name }}
        id:                         build
        run:                        ${{ matrix.config.base_command }} build
        env:
          ## Creating certificates
          #  Generate the certificates from Xcode. You can Manage Certificates in Apple Accounts settings or the Apple Developer account page.
          #  In Xcode Settings: Right click on Developer ID Application, Mac App Distribution (does not exist, maybe also developer id application??) and Mac Installer Distribution certificates.
          #  Select "Export Certificate"
          #  Set a secure password.
          #  For every certificate, export it as base64 encoded string with `base64 -i certificate.p12`
          #  Set the certificates based on the variables below
          JAMULUS_BUILD_VERSION:    ${{ needs.create_release.outputs.build_version }}
          # Android release signing: all-or-nothing, otherwise release builds use a generated debug key.
          JAMULUS_ANDROID_KEYSTORE_BASE64:   ${{ needs.create_release.outputs.android_signing_ready == 'true' && secrets.ANDROID_KEYSTORE || '' }}
          JAMULUS_ANDROID_KEY_ALIAS:         ${{ needs.create_release.outputs.android_signing_ready == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          JAMULUS_ANDROID_KEYSTORE_PASSWORD: ${{ needs.create_release.outputs.android_signing_ready == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          JAMULUS_ANDROID_KEY_PASSWORD:      ${{ needs.create_release.outputs.android_signing_ready == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          MACOS_CERTIFICATE_DEV_ID_APPLICATION:        ${{ secrets.MACOS_CERT }} # Base64 encoded Developer ID Application certificate. See https://help.apple.com/xcode/mac/current/#/dev154b28f09
          MACOS_CERTIFICATE_DEV_ID_APPLICATION_PWD:    ${{ secrets.MACOS_CERT_PWD }} # Password protecting secrets.MACOS_CERTIFICATE_DEV_ID_APPLICATION
          MACOS_CERTIFICATE_DEV_ID_APPLICATION_ID:     ${{ secrets.MACOS_CERT_ID }} # Certificate ID of secrets.MACOS_CERTIFICATE_DEV_ID_APPLICATION. If unknown, import secrets.MACOS_CERT into keychain and get the hash via "security find-identity -v"
          MACOS_CERTIFICATE_INST_DISTRIBUTION:      ${{ secrets.MACAPP_INST_CERT }} # Base64 encoded Mac Installer Distribution certificate
          MACOS_CERTIFICATE_INST_DISTRIBUTION_PWD:  ${{ secrets.MACAPP_INST_CERT_PWD }}
          MACOS_CERTIFICATE_INST_DISTRIBUTION_ID:   ${{ secrets.MACAPP_INST_CERT_ID }}
          MAC_STORE_APP_CERT:       ${{ secrets.MACAPP_CERT }} # Base64 encoded Mac App Distribution certificate
          MAC_STORE_APP_CERT_PWD:   ${{ secrets.MACAPP_CERT_PWD }}
          MAC_STORE_APP_CERT_ID:    ${{ secrets.MACAPP_CERT_ID }}
          NOTARIZATION_PASSWORD:    ${{ secrets.NOTARIZATION_PASSWORD }}
          KEYCHAIN_PASSWORD:        ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_CA_PUBLICKEY:       ${{ secrets.MACOS_CA_PUBKEY }}

      - name:                       Post-Build for ${{ matrix.config.config_name }}
        id:                         get-artifacts
        run:                        ${{ matrix.config.base_command }} get-artifacts
        env:
          JAMULUS_BUILD_VERSION:    ${{ needs.create_release.outputs.build_version }}

      - name:                       Upload Artifact 1 to Job
        # Every build job has at least one artifact. Therefore, no `if` here.
        # If the artifact is missing, this should fail.
        uses:                       actions/upload-artifact@v7
        with:
          name:                     ${{ steps.get-artifacts.outputs.artifact_1 }}
          path:                     deploy/${{ steps.get-artifacts.outputs.artifact_1 }}
          retention-days:           31
          if-no-files-found:        error

      - name:                       Upload Artifact 2 to Job
        if:                         steps.get-artifacts.outputs.artifact_2
        uses:                       actions/upload-artifact@v7
        with:
          name:                     ${{ steps.get-artifacts.outputs.artifact_2 }}
          path:                     deploy/${{ steps.get-artifacts.outputs.artifact_2 }}
          retention-days:           31
          if-no-files-found:        error

      - name:                       Notarize macOS Release Build
        if:                         >-
                                    steps.build.outputs.macos_signed == 'true' &&
                                    needs.create_release.outputs.publish_to_release == 'true' &&
                                    steps.build.outputs.macos_notarize == 'true'
        id:                         notarize-macOS-app
        run:                        ${{ matrix.config.base_command }} notarize
        env:
          JAMULUS_BUILD_VERSION:    ${{ needs.create_release.outputs.build_version }}
          ARTIFACT_PATH:            deploy/${{ steps.get-artifacts.outputs.artifact_1 }}
          NOTARIZATION_USERNAME:    ${{ secrets.NOTARIZATION_USERNAME }} # Apple ID for notarization
          NOTARIZATION_PASSWORD:    ${{ secrets.NOTARIZATION_PASSWORD }} # App specific password for Apple ID
          APPLE_TEAM_ID:            ${{ secrets.NOTARIZATION_TEAM_ID }} # Team ID from App Store Connect

      - name:                       Staple macOS Release Build
        if:                         >-
                                    steps.build.outputs.macos_signed == 'true' &&
                                    needs.create_release.outputs.publish_to_release == 'true' &&
                                    steps.build.outputs.macos_notarize == 'true'
        id:                         staple-macOS-app
        run:                        ${{ matrix.config.base_command }} staple
        env:
          JAMULUS_BUILD_VERSION:    ${{ needs.create_release.outputs.build_version }}
          ARTIFACT_PATH:            deploy/${{ steps.get-artifacts.outputs.artifact_1 }}

      - name:                       Deploy Artifact 1 to Release
        if:                         needs.create_release.outputs.publish_to_release == 'true' &&
                                    !matrix.config.play_store_upload
        id:                         upload-release-asset1
        run:                        >
          gh release upload "${{ needs.create_release.outputs.tag_name }}" "deploy/${{ steps.get-artifacts.outputs.artifact_1 }}" --clobber
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
      - name:                       Deploy Artifact 2 to Release
        if:                         needs.create_release.outputs.publish_to_release == 'true' &&
                                    !matrix.config.play_store_upload &&
                                    steps.get-artifacts.outputs.artifact_2
        id:                         upload-release-asset2
        run:                        >
          gh release upload "${{ needs.create_release.outputs.tag_name }}" "deploy/${{ steps.get-artifacts.outputs.artifact_2 }}" --clobber
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
      - name:                       Perform CodeQL Analysis
        if:                         matrix.config.run_codeql
        uses:                       github/codeql-action/analyze@v4.38.1

  publish_android_play_store:
    name:                           Upload Android Qt5 .aab to Google Play (if requested)
    runs-on:                        ubuntu-22.04
    needs:                          [create_release, release_assets]
    if:                             needs.create_release.outputs.android_play_store_upload == 'true'
    permissions:
      contents:                     write
      id-token:                     write
    steps:
      - name:                       Checkout code
        uses:                       actions/checkout@v7

      - name:                       Download the Android .aab
        uses:                       actions/download-artifact@v8
        with:
          name:                     jamulus_${{ needs.create_release.outputs.build_version }}_android_release_qt5.aab
          path:                     deploy

      - name:                       Select the release bundle
        id:                         select-bundle
        run:                        ./.github/autobuild/android-play-store.sh deploy play-store

      - name:                       Authenticate to Google Cloud
        id:                         gcloud-auth
        uses:                       google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:          ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name:                       Upload to Google Play
        id:                         upload
        uses:                       r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson:       ${{ steps.gcloud-auth.outputs.credentials_file_path }}
          packageName:              app.jamulus.jamulus
          releaseFiles:             ${{ steps.select-bundle.outputs.release_file }}
          releaseName:              ${{ needs.create_release.outputs.build_version }}
          tracks:                   ${{ github.event.inputs.android_play_store_real_publish == 'true' && 'beta' || 'internalsharing' }}
          status:                   ${{ github.event.inputs.android_play_store_real_publish == 'true' && 'draft' || 'completed' }}

      - name:                       Report internal sharing link
        if:                         steps.upload.outputs.internalSharingDownloadUrl
        run:                        |
          echo "Internal sharing URL: ${{ steps.upload.outputs.internalSharingDownloadUrl }}"
          echo "Internal sharing URL: ${{ steps.upload.outputs.internalSharingDownloadUrl }}" >> "${GITHUB_STEP_SUMMARY}"

      - name:                       Attach internal sharing link to the release
        if:                         steps.upload.outputs.internalSharingDownloadUrl &&
                                    needs.create_release.outputs.publish_to_release == 'true'
        run:                        |
          url_file="deploy/jamulus_${{ needs.create_release.outputs.build_version }}_android_release_qt5_internal_sharing.url"
          echo "${{ steps.upload.outputs.internalSharingDownloadUrl }}" > "${url_file}"
          gh release upload "${{ needs.create_release.outputs.tag_name }}" "${url_file}" --clobber
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}

  create_deb_repo:
    name:                           Create files for .deb repository (if requested)
    runs-on:                        ubuntu-22.04
    needs:                          [create_release, release_assets]
    if:                             needs.create_release.outputs.publish_to_release == 'true'
    # Set permissions to allow uploading artifact, uploading to release
    permissions:
      checks:                       write
      contents:                     write
    steps:
      - name:                       Import GPG key
        env:
          GPG_PRIVATE_KEY:          ${{ secrets.GPG_PRIVATE_KEY }}
        run:                        |
          set -eu

          [[ "${GPG_PRIVATE_KEY:-}" ]] || {
              echo "Missing Github secret GPG_PRIVATE_KEY. Please set it on GitHub to enable deb repository releases. Skipping step..."
              echo "GPG_REPO_KEY_MISSING=true" >> ${GITHUB_ENV}
              exit 0
          }

          echo "GPG_REPO_KEY_MISSING=false" >> ${GITHUB_ENV}
          mkdir -p gpghome
          chmod 700 gpghome
          echo "${GPG_PRIVATE_KEY}" | gpg --homedir gpghome --import -
      # Unfortunately download-artifact action doesn't support wild card downloads. Thus downloading all artifacts
      - name:                       Download all artifacts
        if:                         env.GPG_REPO_KEY_MISSING == 'false'
        uses:                       actions/download-artifact@v8
        with:
          path:                     releasedl/
      - name:                       Create Debian repository
        if:                         env.GPG_REPO_KEY_MISSING == 'false'
        run:                        |
          set -eu

          # Create and cd into repo directory
          mkdir repo
          mv releasedl/*.deb/*.deb repo/
          pushd repo

          # create repo files
          apt-ftparchive packages . > Packages
          apt-ftparchive release . > Release
          gpg --homedir "../gpghome" --armor --yes --clearsign --output InRelease --detach-sign Release
          gpg --homedir "../gpghome" --armor --export > "key.asc"

          # remove .deb files as they have been uploaded to the GitHub release already before
          rm *.deb

          popd
      - name:                       Upload Debian repository files to release
        if:                         env.GPG_REPO_KEY_MISSING == 'false'
        env:
          GITHUB_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
        run:                        |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" "repo/InRelease" "repo/key.asc" "repo/Packages" "repo/Release" --clobber -R "${{ github.repository}}"

